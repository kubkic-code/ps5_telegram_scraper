# docker-compose.yml — PlayStation 5 Arbitrage Platform
# DevOps Agent | Produkční konfigurace s persistentním datovým volumem

version: "3.9"

services:
  ps5-scraper:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: ps5-scraper
    restart: unless-stopped

    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SCRAPE_INTERVAL_MIN: ${SCRAPE_INTERVAL_MIN:-120}
      SCRAPE_INTERVAL_MAX: ${SCRAPE_INTERVAL_MAX:-300}
      SEEN_IDS_PATH: /data/seen_ids.json
      DB_PATH: /data/market.db
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_CHAT_IDS: ${TELEGRAM_CHAT_IDS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      HA_WEBHOOK_URL: ${HA_WEBHOOK_URL:-}
      VINTED_ENABLED: ${VINTED_ENABLED:-true}

    volumes:
      # Persistentní uložiště seen_ids.json
      - ps5_data:/data

    # Limit zdrojů (volitelné)
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ps5-dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: ps5-dashboard
    restart: unless-stopped
    command: streamlit run /app/dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8502:8501"
    environment:
      DB_PATH: /data/market.db
    volumes:
      - ps5_data:/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ps5_data:
    driver: local
